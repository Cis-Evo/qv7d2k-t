name: tg-signer-runner

on:
  schedule:
    - cron: '00 00 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  sign-job:
    name: sign-job-name
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: install tg-signer
        run: pip3 install tg-signer

      - name: sign
        env:
          SESSION_STRINGS: ${{ secrets.SESSION_STRINGS }}
          TASK_MAP: ${{ secrets.TASK_MAP }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, sys

          try:
              sessions = json.loads(os.environ.get("SESSION_STRINGS", "[]"))
              task_map = json.loads(os.environ.get("TASK_MAP", "{}"))

              # 单个 session 是 JSON secret 内的字段，GitHub 不会自动打码，这里显式打码
              for s in sessions:
                  if isinstance(s, str) and s:
                      print(f"::add-mask::{s}", flush=True)

              for key, value in task_map.items():
                  session_index = value.get("session_index", 0)

                  if session_index >= len(sessions):
                      raise IndexError("session_index out of range")

                  session_string = sessions[session_index]

                  config = {k: v for k, v in value.items() if k != "session_index"}

                  task_path = f".signer/signs/{key}"
                  os.makedirs(task_path, exist_ok=True)

                  with open(f"{task_path}/config.json", "w") as f:
                      json.dump(config, f)

                  subprocess.run(
                      ["tg-signer", "--session-string", session_string, "run-once", key],
                      check=True,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
          except Exception:
              # 不输出异常内容与回溯，避免命令行参数中的 session 进入日志
              print("sign failed (details hidden)", flush=True)
              sys.exit(1)
          EOF

      - name: 自动续命Actions(防止60天禁用action)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "auto keep actions alive (no code change)"
          git push origin main
